spring.config.import=optional:file:.env[.properties]
spring.application.name=bookingservice
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8092/realms/ticket-reservation

# Firebase
firebase.database.url=${FIREBASE_DATABASE_URL}
firebase.service.account.path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# Inventory Client
inventory.service.url=http://localhost:8080/api/v1/inventory

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=booking
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

services:
  kafka-broker:
    image: apache/kafka:4.2.0
    container_name: kafka-broker
    hostname: kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-schema-registry:
    image: apicurio/apicurio-registry:3.2.1
    container_name: kafka-schema-registry
    restart: unless-stopped
    hostname: kafka-schema-registry
    depends_on:
      kafka-broker:
        condition: service_started
    ports:
      - "8083:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
      APICURIO_STORAGE_SQL_INIT: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka-broker
      - kafka-schema-registry
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://kafka-schema-registry:8080
      DYNAMIC_CONFIG_ENABLED: "true"

  keycloak-db:
    image: mysql:8.4
    container_name: keycloak-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - keycloak-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8092:8080"
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: apigateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      inventoryservice:
        condition: service_started
      bookingservice:
        condition: service_started
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091

      SERVICES_INVENTORY_URL: http://inventoryservice:8080
      SERVICES_BOOKING_URL: http://bookingservice:8081

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8092/realms/ticket-reservation
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticket-reservation/protocol/openid-connect/certs

  orderservice:
    build:
      context: ./orderservice
      dockerfile: Dockerfile
    container_name: orderservice
    restart: unless-stopped
    depends_on:
      kafka-broker:
        condition: service_started
      inventoryservice:
        condition: service_started
    ports:
      - "8086:8082"
    environment:
      SERVER_PORT: 8082

      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092

      INVENTORY_SERVICE_URL: http://inventoryservice:8080/api/v1/inventory
    volumes:
      - ./secrets:/app/secrets:ro

  inventoryservice:
    build:
      context: ./inventoryservice
      dockerfile: Dockerfile
    container_name: inventoryservice
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}
    volumes:
      - ./secrets:/app/secrets:ro

  bookingservice:
    build:
      context: ./bookingservice
      dockerfile: Dockerfile
    container_name: bookingservice
    restart: unless-stopped
    depends_on:
      kafka-broker:
        condition: service_started
      keycloak:
        condition: service_started
      inventoryservice:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081

      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}

      INVENTORY_SERVICE_URL: http://inventoryservice:8080/api/v1/inventory

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8092/realms/ticket-reservation
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticket-reservation/protocol/openid-connect/certs
    volumes:
      - ./secrets:/app/secrets:ro

  frontend:
    build:
      context: ./ticket-reservation-frontend
      dockerfile: Dockerfile
    container_name: ticket-reservation-frontend
    restart: unless-stopped
    depends_on:
      apigateway:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  db-data:
  kafka_data:
  keycloak-db-data:
